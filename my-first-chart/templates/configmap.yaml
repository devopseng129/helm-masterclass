apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-config"

data:
  company: "{{ .Values.application.companyName }}"
  environment: "{{ .Values.application.environment }}"
  owner: "{{ .Values.application.owner }}"
  db_host: "{{ .Values.database.host }}"
  db_port: "{{ .Values.database.port }}"
  redis_host: "{{ .Values.redis.host }}"
  redis_port: "{{ .Values.redis.port }}"
  developers: |
{{ range .Values.developers }}
    - {{ . }}
{{ end }}