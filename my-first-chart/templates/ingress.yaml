{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: "{{ .Release.Name }}-ingress"

spec:

  rules:

  - host: demo.local

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: demo

            port:

              number: 80

{{- end }}